name: liveness-sweep

# Daily passive sweep at 09:00 JST, all year.
#
# This window has expired twice. It started as the judging period alone
# (Jul 13-24), which would have skipped the Aug 19 finals - the one day the
# deployment had to be up - so it was widened to July-August. That widening
# then expired on 2026-08-31: the deployment kept running into September with
# nothing watching it from outside, and the gap was only noticed by reading
# the cron. A window that has to be renewed is not liveness; it is a reminder
# nobody set. Hence '* * *' - the sweep now outlives whatever it was for.
#
# Complements the 5-min Cloud Monitoring uptime check on /health by also
# verifying /smoke wiring, target armed state, and the console auth gate.
# Read-only: no deploys, no writes. Free on a public repo; six requests a day.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  AGENT_URL: https://sida-agent-860561433627.asia-northeast1.run.app
  TARGET_URL: https://sida-target-860561433627.asia-northeast1.run.app

jobs:
  sweep:
    name: passive sweep (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: sweep
        shell: bash
        env:
          CONSOLE_KEY: ${{ secrets.SWEEP_CONSOLE_KEY }}
        run: |
          # Failures are accumulated explicitly — disable errexit so one flaky curl
          # can't kill the whole sweep (curl exits 23 when --retry meets a 503).
          set +e
          fail=0
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          probe() { local out; out=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@"); echo "${out:-000}"; }
          code() { probe --retry 3 --retry-delay 5 "$1"; }

          c=$(code "$AGENT_URL/health")
          [ "$c" = "200" ] && note ":white_check_mark: agent /health 200" || { note ":x: agent /health -> $c (expected 200)"; fail=1; }

          smoke=$(curl -s --retry 3 --retry-delay 5 --max-time 30 "$AGENT_URL/smoke" || echo '{}')
          ok=$(echo "$smoke" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("overall_ok"))' 2>/dev/null || echo parse_error)
          [ "$ok" = "True" ] && note ":white_check_mark: /smoke overall_ok" || { note ":x: /smoke overall_ok -> $ok"; fail=1; }

          # 503 = armed (normal); 200 = recovered, hourly re-arm scheduler will restore.
          # No --retry here: 503 is the EXPECTED answer, and curl treats it as transient.
          c=$(probe "$TARGET_URL/health")
          case "$c" in
            503) note ":white_check_mark: target 503 (armed)";;
            200) note ":warning: target 200 (recovered — hourly re-arm pending, not a failure)";;
            *)   note ":x: target /health -> $c (expected 503 or 200)"; fail=1;;
          esac

          # The console page itself is served keyless by design (no secrets in the HTML);
          # the key gates mutations. Probe the gate with an invalid key: 401 = armed.
          # Side-effect-free — /reset only executes if the gate is broken, and even then
          # it merely re-arms the target to its normal idle state.
          c=$(code "$AGENT_URL/")
          [ "$c" = "200" ] && note ":white_check_mark: console page 200" || { note ":x: console page -> $c (expected 200)"; fail=1; }

          # -d '' sends Content-Length: 0 — Google frontend 411s a bodyless POST before it reaches the gate.
          c=$(probe -X POST -d '' "$AGENT_URL/reset?key=sweep-invalid-probe")
          [ "$c" = "401" ] && note ":white_check_mark: mutation gate 401 on invalid key (armed)" || { note ":x: mutation gate -> $c on invalid key (expected 401)"; fail=1; }

          # A VALID key must open a gated route. This used to GET "/?key=$CONSOLE_KEY"
          # and assert 200 - but the console page is served keyless (see above), so it
          # returned 200 for any key, including a wrong one. It proved nothing.
          # /guard is key-gated, read-only, and returns the guard state, so a 200 here
          # means the key this repo holds is the key the deployment is running.
          if [ -n "$CONSOLE_KEY" ]; then
            c=$(probe --retry 3 --retry-delay 5 -H "Authorization: Bearer $CONSOLE_KEY" "$AGENT_URL/guard")
            [ "$c" = "200" ] && note ":white_check_mark: valid key opens /guard (200)" || { note ":x: /guard with the stored key -> $c (expected 200; the key may have been rotated without updating this secret)"; fail=1; }
          else
            note ":warning: SWEEP_CONSOLE_KEY not set - skipped the keyed check (optional: it is the only check that proves the stored key still matches the deployment)"
          fi

          meta=$(curl -s --retry 3 --retry-delay 5 --max-time 30 "$AGENT_URL/console-meta" || echo '{}')
          video=$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["video"]["available"])' 2>/dev/null || echo parse_error)
          [ "$video" = "True" ] && note ":white_check_mark: /console-meta video available" || { note ":x: /console-meta video.available -> $video"; fail=1; }

          exit $fail
