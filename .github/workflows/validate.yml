name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web (Next.js / TypeScript / biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect web package
        id: detect
        shell: bash
        run: |
          if [ -f apps/ops-console/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false (apps/ops-console not present yet — skipping)"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ops-console/package-lock.json

      - name: npm ci
        if: steps.detect.outputs.exists == 'true'
        working-directory: apps/ops-console
        run: npm ci

      - name: typecheck (tsc --noEmit)
        if: steps.detect.outputs.exists == 'true'
        working-directory: apps/ops-console
        run: npx tsc --noEmit

      - name: lint + format check (biome check)
        if: steps.detect.outputs.exists == 'true'
        working-directory: apps/ops-console
        run: npm run check

  python:
    name: python (ADK agent / syntax + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect python package
        id: detect
        shell: bash
        run: |
          if [ -f packages/agent/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false (packages/agent not present yet — skipping)"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: '3.12.7'
          cache: 'pip'
          cache-dependency-path: packages/agent/requirements.txt

      - name: pip install (dep resolution check)
        if: steps.detect.outputs.exists == 'true'
        working-directory: packages/agent
        run: pip install -r requirements.txt

      - name: py_compile (syntax check)
        if: steps.detect.outputs.exists == 'true'
        working-directory: packages/agent
        shell: bash
        run: |
          find src -name '*.py' -print0 | xargs -0 python -m py_compile

      # Offline smoke gates: pure-stdlib (fake GCP/Gemini injected), no network.
      # The eval judge is the deterministic gate the eval spec requires; the
      # case_store / video_tools / armor_tools contracts ride along (all
      # default-off, never-raises).
      - name: offline smoke tests (deterministic, no GCP)
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          python scripts/test_eval_judge_local.py
          python scripts/test_case_store_local.py
          python scripts/test_video_tools_local.py
          python scripts/test_armor_tools_local.py
          python scripts/test_cost_guard_local.py
          python scripts/test_sse_lifecycle_local.py
          python scripts/test_state_store_local.py
          python scripts/test_env_patch_local.py
          python scripts/test_cost_accounting_local.py
          python scripts/test_autonomy_local.py
          python scripts/test_cli_local.py

      # The CLI is the entry point a stranger uses first, so the install path
      # itself is a gate: a broken pyproject or a renamed console script would
      # otherwise only be found by that stranger. --no-deps because the runtime
      # deps were installed from requirements.txt above.
      - name: CLI entry point (editable install + doctor)
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          pip install --no-deps -e packages/agent
          autosre version
          autosre --help > /dev/null
          # doctor exits 1 on this runner (no GCP config) - that IS the contract:
          # it must report, not crash. Anything other than 0/1 is a real failure.
          # `if` rather than `cmd; code=$?`: this shell runs with -e, which would
          # abort on the expected 1 before the check could read it.
          if autosre doctor; then code=0; else code=$?; fi
          case "$code" in
            0|1) echo "doctor exited $code (reported, did not crash)" ;;
            *) echo "doctor exited $code"; exit 1 ;;
          esac
